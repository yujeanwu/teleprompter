<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1215">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>口播提詞錄影機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: editor sheet → full-bleed front-camera view with a dark prompter panel pinned to the top edge (closest to the lens) → review screen. */
:root{
  --ink:#0d1215;
  --panel:#151c20;
  --rule:#26323a;
  --paper:#ede7da;
  --dim:#87938e;
  --amber:#f1b33b;
  --amber-ink:#1d1405;
  --rec:#e5483d;
  --scrim:rgba(8,11,13,.72);
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--font-body);font-size:14px;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- editor ---------- */
.editor{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding:16px 16px 0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:.04em}
.top h1 span{color:var(--amber)}
.stats{font-family:var(--font-num);font-size:.8rem;color:var(--dim);font-variant-numeric:tabular-nums}
.sheet{position:relative;display:flex;flex-direction:column;flex:1;min-height:38vh}
#script{flex:1;width:100%;min-height:38vh;resize:none;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px 14px 34px;font-size:1.05rem;line-height:1.75}
#script::placeholder{color:var(--dim)}
.sheet-tools{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.chip{background:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:4px 12px;font-size:.78rem;color:var(--dim)}
.chip.warn{border-color:var(--amber);color:var(--amber)}
.hint{margin:0;font-size:.8rem;color:var(--dim);line-height:1.6}
.hint mark{background:none;color:var(--amber);font-weight:700}
.dials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;padding:14px;border-top:1px solid var(--rule)}
.dial{display:flex;flex-direction:column;gap:6px;min-width:0}
.dial label{display:flex;justify-content:space-between;font-size:.82rem;color:var(--dim)}
.dial output{font-family:var(--font-num);color:var(--paper);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--amber);margin:0;height:28px}
.toggles{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;font-size:.88rem}
.toggle input{accent-color:var(--amber);width:18px;height:18px;margin:0}
@media (max-width:420px){.dials{grid-template-columns:1fr;padding-inline:4px}}
.go{position:sticky;bottom:0;padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--ink) 30%)}
.btn-main{width:100%;border:0;border-radius:12px;padding:16px;background:var(--amber);color:var(--amber-ink);font-size:1.1rem;font-weight:700;letter-spacing:.08em}
.btn-main:disabled{opacity:.4}
.err{margin:0;padding:12px 14px;border:1px solid var(--rec);border-radius:10px;color:var(--paper);line-height:1.6;font-size:.9rem}

/* ---------- camera stage ---------- */
.stage{position:fixed;inset:0;z-index:10;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.prompt{position:absolute;left:0;right:0;top:0;overflow:hidden;background:var(--scrim);padding-top:env(safe-area-inset-top,0px)}
.prompt-inner{position:relative;height:100%;overflow:hidden;-webkit-mask-image:linear-gradient(#000 85%,transparent);mask-image:linear-gradient(#000 85%,transparent)}
.track{will-change:transform;padding-inline:18px}
.text{font-weight:500;color:var(--paper);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.text p{margin:0 0 1em;white-space:pre-wrap;word-break:break-word}
.text mark{background:none;color:var(--amber);font-weight:700}
.fade{position:absolute;left:0;right:0;top:0;pointer-events:none;background:linear-gradient(rgba(8,11,13,.85),rgba(8,11,13,.35))}
.band{position:absolute;left:0;right:0;pointer-events:none;border-block:1px solid rgba(241,179,59,.5);background:rgba(241,179,59,.08)}
.band::before,.band::after{content:"";position:absolute;top:50%;border-block:8px solid transparent;transform:translateY(-50%)}
.band::before{left:0;border-left:10px solid var(--amber)}
.band::after{right:0;border-right:10px solid var(--amber)}
.status{position:absolute;right:12px;bottom:10px;display:flex;align-items:center;gap:8px;font-family:var(--font-num);font-size:.8rem;color:var(--dim);font-variant-numeric:tabular-nums;pointer-events:none}
.recdot{display:none;align-items:center;gap:6px;color:var(--paper);background:var(--rec);border-radius:6px;padding:2px 8px}
.recording .recdot{display:inline-flex}
.recdot::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-num);font-size:min(40vw,40vh);color:var(--amber);text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none}

.controls{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:14px 12px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.55) 40%)}
.ctl{min-width:44px;height:44px;padding:0 10px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(13,18,21,.7);font-size:.95rem;display:inline-flex;align-items:center;justify-content:center}
.ctl:disabled{opacity:.35}
.speed{display:inline-flex;align-items:center;gap:4px}
.speed output{font-family:var(--font-num);font-size:.78rem;min-width:4.6em;text-align:center;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000}
.recbtn{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:transparent;display:grid;place-items:center;padding:0;flex:none}
.recbtn i{display:block;width:54px;height:54px;border-radius:50%;background:var(--rec);transition:all .2s}
.recording .recbtn i{width:28px;height:28px;border-radius:6px}
.row{display:flex;gap:8px;align-items:center}
@media (prefers-reduced-motion:reduce){.recbtn i{transition:none}}

/* ---------- review ---------- */
.review{position:fixed;inset:0;z-index:20;background:var(--ink);display:flex;flex-direction:column;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.review video{flex:1;min-height:0;width:100%;background:#000;border-radius:10px;object-fit:contain}
.review .meta{font-family:var(--font-num);font-size:.8rem;color:var(--dim);text-align:center}
.review .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:12px;padding:14px;font-size:1rem;text-align:center;text-decoration:none;color:var(--paper)}
.btn.primary{grid-column:1/-1;background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:700}
.review .note{margin:0;font-size:.8rem;color:var(--dim);line-height:1.6;text-align:center}
</style>
</head>
<body>

<main class="editor" id="editor">
  <div class="top">
    <h1>口播<span>提詞錄影機</span></h1>
    <div class="stats" id="stats">0 字</div>
  </div>
  <div class="sheet">
    <textarea id="script" spellcheck="false" placeholder="把講稿貼在這裡。空一行代表換段。"></textarea>
    <div class="sheet-tools"><button class="chip" id="clear" type="button">清空</button></div>
  </div>
  <p class="hint">空一行＝換段;<mark>**兩個星號**</mark> 包起來的字會標黃色。錄影時點上方字幕區＝暫停/繼續捲動(不會停錄),手指上下拖可以倒回。</p>
  <p class="err" id="err" hidden></p>

  <section class="dials" aria-label="提詞設定">
    <div class="dial"><label for="cpm">速度 <output id="cpmOut"></output></label><input type="range" id="cpm" min="100" max="420" step="10"></div>
    <div class="dial"><label for="size">字級 <output id="sizeOut"></output></label><input type="range" id="size" min="20" max="64" step="2"></div>
    <div class="dial"><label for="panel">提詞區高度 <output id="panelOut"></output></label><input type="range" id="panel" min="25" max="70" step="1"></div>
    <div class="dial"><label for="guide">視線位置 <output id="guideOut"></output></label><input type="range" id="guide" min="10" max="60" step="1"></div>
    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="countdown"> 開錄前倒數 3 秒</label>
    </div>
  </section>

  <div class="go"><button class="btn-main" id="open" type="button">打開前鏡頭</button></div>
</main>

<section class="stage" id="stage" hidden>
  <video id="cam" playsinline muted autoplay></video>
  <div class="prompt" id="prompt">
    <div class="prompt-inner" id="promptInner">
      <div class="track" id="track"><div class="text" id="text"></div></div>
      <div class="fade" id="fade"></div>
      <div class="band" id="band"></div>
      <div class="status"><span class="recdot" id="recTime">00:00</span><span id="clock"></span></div>
    </div>
  </div>
  <div class="count" id="count" hidden></div>
  <nav class="controls" aria-label="錄影控制">
    <div class="row">
      <button class="ctl" id="exit" type="button" aria-label="回到編輯">✕</button>
      <button class="ctl" id="restart" type="button" aria-label="字幕回到開頭">⟲</button>
      <button class="ctl" id="smaller" type="button" aria-label="字變小">A−</button>
      <button class="ctl" id="bigger" type="button" aria-label="字變大">A+</button>
    </div>
    <button class="recbtn" id="rec" type="button" aria-label="開始錄影"><i></i></button>
    <div class="row speed">
      <button class="ctl" id="slower" type="button" aria-label="變慢">−</button>
      <output id="speedOut"></output>
      <button class="ctl" id="faster" type="button" aria-label="變快">+</button>
    </div>
  </nav>
</section>

<section class="review" id="review" hidden>
  <video id="playback" playsinline controls></video>
  <div class="meta" id="meta"></div>
  <div class="actions">
    <button class="btn primary" id="share" type="button" hidden>存到相簿 / 分享</button>
    <a class="btn primary" id="download" href="#">下載影片</a>
    <button class="btn" id="retake" type="button">重錄</button>
    <button class="btn" id="back" type="button">回去改稿</button>
  </div>
  <p class="note" id="note">影片只存在這支手機上,不會上傳到任何地方。按「重錄」之前記得先存。</p>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('tpr.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('tpr.' + k, JSON.stringify(v)); } catch {} }
  };

  const SAMPLE = `（範例稿,直接改成你的內容）

大家好,今天想跟你分享一個我最近很常用的小技巧:**先寫稿,再開錄**。

很多人以為口播就是對著鏡頭聊天,結果一開口就卡住,同一句話重錄五六次。

其實你只要先把想講的重點寫下來,每段不要超過三句,錄的時候眼睛跟著黃色那條線走,講起來就會很順。

錄完丟給剪片助理,NG 跟停頓它會幫你剪掉,**你只要專心講就好**。

我們下支影片見。`;

  const S = {
    cpm: store.get('cpm', 220),
    size: store.get('size', 30),
    panel: store.get('panel', 40),
    guide: store.get('guide', 22),
    countdown: store.get('countdown', true),
    lh: 1.5,
  };

  const script = $('script');
  script.value = store.get('script', SAMPLE);
  const charCount = s => s.replace(/\*\*/g, '').replace(/\s/g, '').length;
  const mmss = sec => { sec = Math.max(0, Math.round(sec)); return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); };
  const fmtLong = sec => { sec = Math.round(sec); const m = Math.floor(sec / 60), s = sec % 60; return (m ? m + ' 分 ' : '') + s + ' 秒'; };

  /* ---------- editor ---------- */
  const dials = {
    cpm: v => v + ' 字/分',
    size: v => v + ' px',
    panel: v => '畫面 ' + v + '%',
    guide: v => '上方 ' + v + '%',
  };
  for (const k of Object.keys(dials)) {
    const el = $(k), out = $(k + 'Out');
    el.value = S[k];
    out.textContent = dials[k](S[k]);
    el.addEventListener('input', () => { S[k] = Number(el.value); out.textContent = dials[k](S[k]); store.set(k, S[k]); updateStats(); });
  }
  $('countdown').checked = S.countdown;
  $('countdown').addEventListener('change', () => { S.countdown = $('countdown').checked; store.set('countdown', S.countdown); });

  function updateStats() {
    const n = charCount(script.value);
    $('stats').textContent = n ? `${n} 字 · 約 ${fmtLong(n / S.cpm * 60)}` : '還沒有稿子';
    $('open').disabled = !n;
  }
  script.addEventListener('input', () => { store.set('script', script.value); updateStats(); resetClear(); });
  updateStats();

  let clearArmed = false, clearTimer;
  function resetClear() { clearArmed = false; $('clear').textContent = '清空'; $('clear').classList.remove('warn'); }
  $('clear').addEventListener('click', () => {
    if (!clearArmed) {
      clearArmed = true; $('clear').textContent = '再按一次清空'; $('clear').classList.add('warn');
      clearTimeout(clearTimer); clearTimer = setTimeout(resetClear, 2500); return;
    }
    script.value = ''; store.set('script', ''); resetClear(); updateStats(); script.focus();
  });

  function showError(msg) { $('err').textContent = msg; $('err').hidden = !msg; }

  /* ---------- camera ---------- */
  const stage = $('stage'), cam = $('cam');
  let stream = null;

  async function openCamera() {
    showError('');
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      showError('這個網址不能用相機。請用 https:// 開頭的網址打開這一頁(不是直接點檔案)。');
      return false;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } },
        audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true },
      });
    } catch (e) {
      if (e.name === 'NotAllowedError') showError('相機或麥克風被擋住了。iPhone:設定 → Safari → 相機、麥克風改成「允許」;Android:點網址列左邊的鎖頭 → 權限 → 相機、麥克風打開。改完重新整理這一頁。');
      else if (e.name === 'NotFoundError') showError('找不到相機或麥克風。');
      else if (e.name === 'NotReadableError') showError('相機正在被別的 App 使用,先把那個 App 關掉再試一次。');
      else showError('打不開相機:' + e.name + ' ' + e.message);
      return false;
    }
    cam.srcObject = stream;
    try { await cam.play(); } catch {}
    return true;
  }
  function closeCamera() {
    stream?.getTracks().forEach(t => t.stop());
    stream = null;
    cam.srcObject = null;
  }

  /* ---------- prompter ---------- */
  const track = $('track'), text = $('text'), inner = $('promptInner');
  let y = 0, textH = 0, pps = 0, chars = 0, scrolling = false, last = 0, raf = 0, countTimer = 0;
  let wakeLock = null;

  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const toHTML = src => esc(src.trim()).split(/\n\s*\n/).map(p => '<p>' + p.replace(/\*\*(.+?)\*\*/gs, '<mark>$1</mark>') + '</p>').join('');

  function layout() {
    const prog = textH ? y / textH : 0;
    $('prompt').style.height = S.panel + '%';
    const h = inner.clientHeight;
    const lineH = S.size * S.lh;
    const guideY = Math.max(lineH / 2 + 4, h * S.guide / 100);
    text.style.fontSize = S.size + 'px';
    text.style.lineHeight = S.lh;
    track.style.paddingTop = (guideY - lineH / 2) + 'px';
    track.style.paddingBottom = h + 'px';
    $('band').style.top = (guideY - lineH / 2) + 'px';
    $('band').style.height = lineH + 'px';
    $('fade').style.height = Math.max(0, guideY - lineH / 2) + 'px';
    textH = text.offsetHeight;
    pps = chars ? (S.cpm / 60) * (textH / chars) : 0;
    y = prog * textH;
    paint();
  }
  function paint() {
    track.style.transform = `translateY(${-y}px)`;
    $('clock').textContent = pps ? '稿剩 ' + mmss((textH - y) / pps) : '';
    $('speedOut').textContent = S.cpm + ' 字/分';
  }
  function frame(t) {
    if (!scrolling) return;
    const dt = Math.min(0.1, (t - last) / 1000);
    last = t;
    y += pps * dt;
    if (y >= textH) { y = textH; scrolling = false; }
    paint();
    if (scrolling) raf = requestAnimationFrame(frame);
  }
  function scrollOn() { if (scrolling || !textH) return; if (y >= textH) y = 0; scrolling = true; last = performance.now(); raf = requestAnimationFrame(frame); }
  function scrollOff() { scrolling = false; cancelAnimationFrame(raf); }

  /* ---------- recording ---------- */
  let recorder = null, chunks = [], recStart = 0, recDur = 0, recTick = 0, blobUrl = null, lastFile = null;
  const recording = () => recorder && recorder.state === 'recording';

  function pickMime() {
    const list = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    if (!window.MediaRecorder) return null;
    for (const m of list) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch {} }
    return '';
  }

  function startRecording() {
    const mime = pickMime();
    if (mime === null) { alertStage('這支手機的瀏覽器不支援錄影,請更新系統或改用 Chrome / Safari。'); return; }
    chunks = [];
    try {
      recorder = new MediaRecorder(stream, { ...(mime ? { mimeType: mime } : {}), videoBitsPerSecond: 8_000_000, audioBitsPerSecond: 160_000 });
    } catch {
      recorder = new MediaRecorder(stream);
    }
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = finishRecording;
    recorder.start(1000);
    recStart = performance.now();
    stage.classList.add('recording');
    $('rec').setAttribute('aria-label', '停止錄影');
    $('recTime').textContent = '00:00';
    recTick = setInterval(() => { $('recTime').textContent = mmss((performance.now() - recStart) / 1000); }, 250);
    scrollOn();
  }
  function stopRecording() {
    if (!recording()) return;
    scrollOff();
    clearInterval(recTick);
    recDur = (performance.now() - recStart) / 1000;
    recorder.stop();
  }
  function finishRecording() {
    stage.classList.remove('recording');
    $('rec').setAttribute('aria-label', '開始錄影');
    const type = (recorder.mimeType || chunks[0]?.type || 'video/mp4').split(';')[0];
    const blob = new Blob(chunks, { type });
    chunks = [];
    if (!blob.size) { alertStage('錄影失敗,沒有存到畫面。再試一次看看。'); return; }
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const name = `口播-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${ext}`;
    lastFile = new File([blob], name, { type });
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(blob);
    $('playback').src = blobUrl;
    $('download').href = blobUrl;
    $('download').download = name;
    $('meta').textContent = `${name} · ${(blob.size / 1048576).toFixed(1)} MB · ${mmss(recDur)}`;
    const canShare = !!(navigator.canShare && navigator.canShare({ files: [lastFile] }));
    $('share').hidden = !canShare;
    $('download').classList.toggle('primary', !canShare);
    $('review').hidden = false;
  }

  function alertStage(msg) {
    const el = $('count');
    el.style.fontSize = '1.1rem';
    el.style.padding = '0 24px';
    el.style.textAlign = 'center';
    el.textContent = msg;
    el.hidden = false;
    setTimeout(() => { el.hidden = true; el.removeAttribute('style'); }, 4000);
  }

  function countdownThen(fn) {
    if (!S.countdown) { fn(); return; }
    const el = $('count');
    let n = 3;
    el.hidden = false; el.textContent = n;
    $('rec').disabled = true;
    countTimer = setInterval(() => {
      n -= 1;
      if (n > 0) { el.textContent = n; return; }
      cancelCount();
      fn();
    }, 1000);
  }
  function cancelCount() { clearInterval(countTimer); countTimer = 0; $('count').hidden = true; $('rec').disabled = false; }

  $('rec').addEventListener('click', () => {
    if (recording()) stopRecording();
    else if (!countTimer) countdownThen(startRecording);
  });

  /* ---------- enter / exit ---------- */
  async function lockScreen() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch { wakeLock = null; } }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && recording()) stopRecording();
    if (document.visibilityState === 'visible' && !stage.hidden) lockScreen();
  });

  $('open').addEventListener('click', async () => {
    chars = charCount(script.value);
    if (!chars) return;
    $('open').disabled = true;
    $('open').textContent = '打開相機中…';
    const ok = await openCamera();
    $('open').textContent = '打開前鏡頭';
    updateStats();
    if (!ok) return;
    text.innerHTML = toHTML(script.value);
    y = 0; textH = 0;
    $('editor').hidden = true;
    stage.hidden = false;
    lockScreen();
    requestAnimationFrame(layout);
  });

  function toEditor() {
    cancelCount();
    if (recording()) stopRecording();
    scrollOff();
    closeCamera();
    stage.hidden = true;
    $('review').hidden = true;
    $('editor').hidden = false;
    try { wakeLock?.release(); } catch {}
    wakeLock = null;
    for (const k of ['cpm', 'size']) { $(k).value = S[k]; $(k + 'Out').textContent = dials[k](S[k]); store.set(k, S[k]); }
    updateStats();
  }
  $('exit').addEventListener('click', toEditor);
  $('back').addEventListener('click', toEditor);
  $('retake').addEventListener('click', () => {
    $('playback').pause();
    $('review').hidden = true;
    y = 0; paint();
  });
  $('share').addEventListener('click', async () => {
    try { await navigator.share({ files: [lastFile] }); } catch {}
  });

  /* ---------- prompter gestures ---------- */
  const setSpeed = d => { S.cpm = Math.min(420, Math.max(100, S.cpm + d)); store.set('cpm', S.cpm); layout(); };
  const setSize = d => { S.size = Math.min(64, Math.max(20, S.size + d)); store.set('size', S.size); layout(); };
  $('slower').addEventListener('click', () => setSpeed(-10));
  $('faster').addEventListener('click', () => setSpeed(10));
  $('smaller').addEventListener('click', () => setSize(-2));
  $('bigger').addEventListener('click', () => setSize(2));
  $('restart').addEventListener('click', () => { y = 0; paint(); });

  // 點字幕區＝暫停/繼續捲動;上下拖＝倒回或跳過(都不影響錄影)
  const prompt = $('prompt');
  let drag = null;
  prompt.addEventListener('pointerdown', e => {
    drag = { id: e.pointerId, startY: e.clientY, startPos: y, moved: false, was: scrolling };
    prompt.setPointerCapture(e.pointerId);
  });
  prompt.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dy = e.clientY - drag.startY;
    if (!drag.moved && Math.abs(dy) > 8) { drag.moved = true; scrollOff(); }
    if (drag.moved) { y = Math.min(textH, Math.max(0, drag.startPos - dy)); paint(); }
  });
  const endDrag = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    if (!d.moved) { scrolling ? scrollOff() : scrollOn(); return; }
    if (d.was) scrollOn();
  };
  prompt.addEventListener('pointerup', endDrag);
  prompt.addEventListener('pointercancel', endDrag);

  window.addEventListener('resize', () => { if (!stage.hidden) layout(); });
})();
</script>
</body>
</html>
